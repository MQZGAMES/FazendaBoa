<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fazenda Boa" />
  <meta name="description" content="Fazenda Boa - um jogo de fazenda aconchegante em pixel art para jogar no celular, em retrato, com uma mão." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <title>Fazenda Boa</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #1a110a; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font-family: system-ui, sans-serif;
    }
    body { position: fixed; inset: 0; height: 100dvh; }
    #game {
      position: absolute; left: 0; top: 0; width: 100vw; height: 100dvh;
      overflow: hidden; background: #1a110a; touch-action: none;
    }
    #game canvas { display: block; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }
    /* Desktop em paisagem: coluna em retrato centralizada */
    @media (orientation: landscape) and (hover: hover) and (pointer: fine) {
      #game { left: 50%; transform: translateX(-50%); width: min(100vw, calc(100dvh * 0.5625)); box-shadow: 0 0 40px #000; }
    }
    #safe-probe {
      position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 20; background: #2b1a0f;
      color: #fff3d6; align-items: center; justify-content: center; flex-direction: column; text-align: center;
    }
    #rotate .phone { width: 48px; height: 84px; border: 6px solid #e8b06a; border-radius: 10px; animation: rot 2s ease-in-out infinite; }
    #rotate p { font-size: 18px; margin-top: 24px; letter-spacing: 1px; }
    @keyframes rot { 0%,30% { transform: rotate(90deg); } 60%,100% { transform: rotate(0deg); } }
    @media (orientation: landscape) and (pointer: coarse) and (max-height: 600px) {
      #rotate { display: flex; }
    }
    #boot-msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #e8b06a; font-size: 14px; }
  </style>
  <script type="module" crossorigin src="./assets/index-B2fqC5zH.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/phaser-DXXWZowi.js">
</head>
<body>
  <div id="safe-probe"></div>
  <div id="game"><div id="boot-msg">Carregando…</div></div>
  <div id="rotate"><div class="phone"></div><p>Gire o celular para<br/>o modo retrato</p></div>
</body>
</html>
